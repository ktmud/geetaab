# Generated into an Xcode project with `xcodegen generate` (brew install xcodegen).
#
# The project file itself is not committed: it is derived from this, and a
# derived file in version control is a merge conflict waiting to happen.
name: Geetaab
options:
  bundleIdPrefix: app.geetaab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GeetaabKit:
    path: ../GeetaabKit

targets:
  Geetaab:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: GeetaabKit
        product: GeetaabCore
      - package: GeetaabKit
        product: GeetaabAudio
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: geetaab
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # The one permission this app asks for. It records; it never sends.
        NSMicrophoneUsageDescription: >-
          geetaab listens to a song through the microphone to work out its
          chords. The recording stays on this iPhone and is never uploaded.
        NSAppleMusicUsageDescription: >-
          geetaab can read songs you own from your music library. Tracks from an
          Apple Music subscription are copy-protected and cannot be read.
        # Recording has to survive the player switching to a music app to press
        # play, which is the whole point of holding the phone near a speaker.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.geetaab.Geetaab
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
